name: Attest release assets

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  attest-release-assets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout released source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build from source
        run: npm run build

      - name: Collect build output
        run: |
          mkdir -p built
          cp main.js manifest.json styles.css built/

      - name: Download published release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p release-assets
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir release-assets \
            --pattern main.js \
            --pattern manifest.json \
            --pattern styles.css

      - name: Verify assets match the released source
        run: |
          set -euo pipefail
          test -f built/main.js
          test -f built/manifest.json
          test -f built/styles.css
          test -f release-assets/main.js
          test -f release-assets/manifest.json
          test -f release-assets/styles.css

          cmp built/main.js release-assets/main.js
          cmp built/manifest.json release-assets/manifest.json

          # styles.css may be checked out with different line endings on Windows.
          tr -d '\r' < built/styles.css > /tmp/built-styles.css
          tr -d '\r' < release-assets/styles.css > /tmp/release-styles.css
          cmp /tmp/built-styles.css /tmp/release-styles.css

      - name: Attest published assets
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release-assets/main.js
            release-assets/manifest.json
            release-assets/styles.css